<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copee Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .help-text {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .status {
      padding: 12px;
      border-radius: 4px;
      margin-top: 16px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    .default-value {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Copee Settings</h1>
    
    <form id="settings-form">
      <div class="form-group">
        <label for="api-endpoint">API Endpoint</label>
        <input type="text" id="api-endpoint" placeholder="http://localhost:3000" />
        <div class="help-text">Default: http://localhost:3000</div>
      </div>

      <div class="form-group">
        <label for="auth-token">Auth Token <span style="color: red;">*</span></label>
        <input type="password" id="auth-token" placeholder="Your Copee auth token" />
        <div class="help-text">
          Required. Get your token from: <a href="http://localhost:3000/dashboard/user-settings" target="_blank">Copee Dashboard → User Settings</a>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
