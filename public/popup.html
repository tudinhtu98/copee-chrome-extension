<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copee - Copy Product</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }

    .logo {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
    }

    .product-info {
      margin-bottom: 16px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }

    .product-price {
      font-size: 16px;
      font-weight: 600;
      color: #f1582c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .price-original {
      color: #999;
      text-decoration: line-through;
      font-size: 13px;
      font-weight: 400;
    }

    .price-current {
      color: #f1582c;
      font-size: 16px;
      font-weight: 600;
    }

    .price-loading {
      color: #999;
      font-weight: 400;
      font-style: italic;
    }

    .product-images-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .product-images {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .product-images::-webkit-scrollbar {
      height: 6px;
    }

    .product-images::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    .product-images::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    .product-image {
      width: 60px;
      height: 60px;
      min-width: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .status {
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      text-align: center;
    }

    .status-success {
      background: #d4edda;
      color: #155724;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
    }

    .status-loading {
      background: #d1ecf1;
      color: #0c5460;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }

    .settings-link {
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      display: block;
      margin-top: 8px;
    }

    .settings-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon128.png" alt="Copee Logo">
    </div>
    <div class="title">Copee</div>
  </div>

  <div id="product-container">
    <div class="empty">Loading product data...</div>
  </div>

  <script src="../src/popup/popup.js"></script>
</body>
</html>
